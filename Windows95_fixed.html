*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font:14px 'MS Sans Serif',Tahoma,Arial,sans-serif;touch-action:none}button,input,textarea{font:inherit}button{cursor:pointer}#desktop{height:100dvh;background:#008080;position:relative;color:white;overflow:hidden}.icons{display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:8px;height:calc(100% - 48px);padding:15px}.desk-icon{width:92px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;user-select:none;cursor:pointer;text-shadow:1px 1px #000;padding:4px;border:1px solid transparent}.desk-icon:active,.desk-icon.selected{background:#00008055;border:1px dotted white}.ico{font-size:34px;filter:drop-shadow(1px 1px #222)}.bar{position:absolute;bottom:0;left:0;right:0;height:43px;background:#c0c0c0;border-top:2px solid #fff;display:flex;align-items:center;padding:4px;gap:5px;color:black;z-index:9000}.classic{background:#c0c0c0;color:#000;border:2px solid;border-color:#fff #555 #555 #fff;box-shadow:1px 1px #000;padding:4px 9px}.classic:active,.classic.active{border-color:#555 #fff #fff #555}.start{font-weight:bold;font-size:16px;white-space:nowrap}.task-list{display:flex;gap:4px;flex:1;min-width:0;overflow:auto}.task{min-width:85px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}.clock{border:1px inset #fff;padding:6px;white-space:nowrap}.start-menu{position:absolute;bottom:43px;left:3px;width:250px;background:#c0c0c0;border:2px solid;border-color:#fff #333 #333 #fff;z-index:9100;display:none;color:black;box-shadow:2px 2px #111}.start-menu.open{display:flex;pointer-events:auto}.start{touch-action:manipulation;min-height:34px;position:relative;z-index:1}.start-brand{background:#808080;color:white;writing-mode:vertical-rl;transform:rotate(180deg);font-size:20px;font-weight:bold;padding:12px 8px}.start-items{flex:1;padding:5px}.menu-item{padding:12px 8px;cursor:pointer}.menu-item:hover{background:#000080;color:white}.window{position:absolute;background:#c0c0c0;border:2px solid;border-color:#fff #333 #333 #fff;box-shadow:2px 2px 0 #202020;color:black;min-width:230px;min-height:130px;display:flex;flex-direction:column;overflow:hidden}.titlebar{height:31px;flex:none;background:#808080;color:#eee;display:flex;align-items:center;gap:5px;padding:3px 4px;touch-action:none;user-select:none;cursor:move}.window.focused .titlebar{background:linear-gradient(90deg,#000080,#1084d0);color:white}.title-text{font-weight:bold;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.title-btn{width:26px;height:24px;line-height:16px;padding:0;font-weight:bold}.content{flex:1;min-height:0;overflow:auto;padding:9px;touch-action:pan-y}.status{padding:4px;border-top:1px solid #888;font-size:12px}.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}.field{border:2px inset #fff;background:white;padding:6px;min-width:0}.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px}.file{display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;overflow-wrap:anywhere;cursor:pointer;padding:6px}.file:hover{background:#000080;color:white}.file small{font-size:11px}.note{width:100%;height:100%;min-height:160px;resize:none;background:#fff;border:2px inset #fff;padding:10px;touch-action:pan-y}.viewer{max-width:100%;max-height:100%;object-fit:contain;display:block;margin:auto}.player{display:flex;flex-direction:column;gap:12px}.track{padding:8px;background:#000;color:#0f0;font-family:monospace;overflow-wrap:anywhere}.playbar{display:flex;align-items:center;gap:6px}.playbar input{width:100%;min-width:0}.screen{position:absolute;inset:0;z-index:10000;background:black;color:#00ff65;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;font:24px monospace;padding:25px;cursor:pointer}.screen.on{display:flex}.screen .moving{animation:float 8s linear infinite}@keyframes float{0%{transform:translate(-25vw,-18vh)}50%{transform:translate(20vw,17vh)}100%{transform:translate(-25vw,-18vh)}}.hint{font-size:12px;color:#555}.empty{padding:24px;text-align:center;color:#555}.resize{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 45%,#777 50%,transparent 55%,transparent 65%,#777 70%,transparent 75%)}@media(max-width:650px){.icons{gap:2px;padding:8px}.desk-icon{width:80px;font-size:12px}.ico{font-size:29px}.bar{height:47px}.start-menu{bottom:47px}.window{max-width:100vw}.clock{font-size:11px}}

(()=>{'use strict';const $=s=>document.querySelector(s),desktop=$('#desktop'),icons=$('#icons'),tasks=$('#tasks'),menu=$('#startMenu'),picker=$('#picker');let z=20,seq=0,active=null,audioCtx=null,lastAction=Date.now(),screenTimer=null;const wins=new Map(),dbName='retro95-files';let db=null;const appList=[['computer','💻','マイコンピュータ'],['music','💿','音楽プレイヤー'],['photos','🖼️','写真ビューア'],['notes','📝','メモ帳'],['settings','⚙️','設定']];const defaultNotes='Retro 95へようこそ！\n\nこのメモは自動保存されます。\n音楽や画像は「マイコンピュータ」から追加できます。';function sound(freq=650,duration=.045,type='square'){try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.025,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration)}catch(e){}}function startup(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>sound(f,.2,'sine'),i*130))}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(dbName,1);req.onupgradeneeded=()=>{req.result.createObjectStore('files',{keyPath:'id',autoIncrement:true})};req.onsuccess=()=>{db=req.result;resolve()};req.onerror=()=>reject(req.error)})}function getFiles(){return new Promise((resolve,reject)=>{if(!db)return resolve([]);let r=db.transaction('files').objectStore('files').getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function addFiles(files){return new Promise((resolve,reject)=>{if(!db)return reject(Error('データベースが利用できません'));const tx=db.transaction('files','readwrite'),store=tx.objectStore('files');files.forEach(f=>{if(f.type.startsWith('audio/')||f.type.startsWith('image/'))store.add({name:f.name,type:f.type,size:f.size,blob:f,created:Date.now()})});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}function deleteFile(id){return new Promise((resolve,reject)=>{let tx=db.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}function focusWin(id){const w=wins.get(id);if(!w)return;for(const v of wins.values())v.el.classList.remove('focused');w.el.classList.add('focused');w.el.style.zIndex=++z;active=id;renderTasks()}function renderTasks(){tasks.innerHTML='';for(const [id,w] of wins){const b=document.createElement('button');b.className='classic task'+(id===active?' active':'');b.textContent=w.icon+' '+w.title;b.onclick=()=>{if(w.el.style.display==='none'){w.el.style.display='flex';focusWin(id)}else if(active===id){w.el.style.display='none';active=null;renderTasks()}else focusWin(id)};tasks.append(b)}}function closeWin(id){const w=wins.get(id);if(!w)return;w.cleanup?.();w.el.remove();wins.delete(id);if(active===id)active=null;renderTasks();sound(420)}function makeWin(kind,title,icon,body,width=540,height=380,cleanup){let id=++seq;const el=document.createElement('div');el.className='window';el.style.width=Math.min(width,innerWidth-12)+'px';el.style.height=Math.min(height,innerHeight-62)+'px';el.style.left=Math.max(2,Math.min(55+(id%6)*28,innerWidth-250))+'px';el.style.top=Math.max(2,Math.min(35+(id%5)*26,innerHeight-200))+'px';el.innerHTML=`<div class="titlebar"><span>${icon}</span><span class="title-text">${escapeHtml(title)}</span><button class="classic title-btn" data-action="min">_</button><button class="classic title-btn" data-action="max">□</button><button class="classic title-btn" data-action="close">×</button></div><div class="content"></div><div class="resize"></div>`;el.querySelector('.content').append(body);desktop.append(el);wins.set(id,{el,title,icon,kind,cleanup});focusWin(id);sound(800);el.addEventListener('pointerdown',()=>focusWin(id));el.querySelector('[data-action=close]').onclick=()=>closeWin(id);el.querySelector('[data-action=min]').onclick=()=>{el.style.display='none';active=null;renderTasks()};let saved=null;el.querySelector('[data-action=max]').onclick=()=>{if(saved){Object.assign(el.style,saved);saved=null}else{saved={left:el.style.left,top:el.style.top,width:el.style.width,height:el.style.height};Object.assign(el.style,{left:'2px',top:'2px',width:(innerWidth-4)+'px',height:(innerHeight-49)+'px'})}};function draggable(handle,resize){let p=null;handle.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;p={x:e.clientX,y:e.clientY,left:el.offsetLeft,top:el.offsetTop,width:el.offsetWidth,height:el.offsetHeight};handle.setPointerCapture(e.pointerId);e.preventDefault()});handle.addEventListener('pointermove',e=>{if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;if(resize){el.style.width=Math.max(230,Math.min(innerWidth-p.left,p.width+dx))+'px';el.style.height=Math.max(130,Math.min(innerHeight-46-p.top,p.height+dy))+'px'}else{el.style.left=Math.max(0,Math.min(innerWidth-90,p.left+dx))+'px';el.style.top=Math.max(0,Math.min(innerHeight-90,p.top+dy))+'px'}});const stop=()=>p=null;handle.addEventListener('pointerup',stop);handle.addEventListener('pointercancel',stop)}draggable(el.querySelector('.titlebar'),false);draggable(el.querySelector('.resize'),true);return id}function node(html){const e=document.createElement('div');e.innerHTML=html;return e}function importFiles(){picker.value='';picker.click()}picker.onchange=async()=>{try{await addFiles([...picker.files]);sound(880,.15);refreshFiles()}catch(e){alert('保存できませんでした。空き容量またはブラウザの設定をご確認ください。')}};async function refreshFiles(){for(const [id,w] of wins){if(['computer','photos','music'].includes(w.kind)){const body=w.el.querySelector('.content');const state=w.kind==='music'?{playing:body.querySelector('audio')?.currentTime||0}:null;w.cleanup?.();let result=await renderApp(w.kind);body.replaceChildren(result.body);w.cleanup=result.cleanup;}}}async function renderApp(kind){let body,cleanup=null;if(kind==='notes'){body=node('<div style="height:100%;display:flex;flex-direction:column"><div class="hint">自動保存 ON — このブラウザ内に保存</div><textarea class="note" spellcheck="false" aria-label="メモ"></textarea></div>');const ta=body.querySelector('textarea');try{ta.value=localStorage.getItem('retro95-notes')??defaultNotes}catch(e){ta.value=defaultNotes}ta.addEventListener('input',()=>{try{localStorage.setItem('retro95-notes',ta.value)}catch(e){}})}else if(kind==='settings'){body=node('<h3>⚙️ Retro 95 設定</h3><p>スクリーンセーバー: 2分間操作がないと起動します。</p><p>データはこのブラウザの端末内に保存されます。</p><div class="toolbar"><button class="classic" id="testSound">起動音を再生</button><button class="classic" id="showScreen">スクリーンセーバー</button></div><p class="hint">ホーム画面に追加するとアプリのように使えます。ブラウザデータを消去すると保存データも失われます。</p>');body.querySelector('#testSound').onclick=startup;body.querySelector('#showScreen').onclick=showScreen}else{const files=await getFiles();const filtered=kind==='computer'?files:files.filter(f=>kind==='music'?f.type.startsWith('audio/'):f.type.startsWith('image/'));body=node(`<div class="toolbar"><button class="classic" data-import>📥 ファイルを追加</button><button class="classic" data-refresh>🔄 更新</button></div><div class="hint">${kind==='computer'?'C:\\ My Files':kind==='music'?'C:\\ Music':'C:\\ Pictures'} — ${filtered.length} ファイル</div><hr><div class="file-grid"></div>`);body.querySelector('[data-import]').onclick=importFiles;body.querySelector('[data-refresh]').onclick=refreshFiles;const grid=body.querySelector('.file-grid');if(!filtered.length)grid.innerHTML='<div class="empty">ファイルがありません。<br>「ファイルを追加」から読み込んでください。</div>';for(const f of filtered){const entry=document.createElement('div');entry.className='file';entry.innerHTML=`<span class="ico">${f.type.startsWith('audio/')?'🎵':'🖼️'}</span><span>${escapeHtml(f.name)}</span><small>${(f.size/1024/1024).toFixed(1)} MB</small>`;entry.onclick=()=>openFile(f);entry.oncontextmenu=e=>{e.preventDefault();if(confirm('このファイルを削除しますか？'))deleteFile(f.id).then(refreshFiles)};let longPress;entry.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')longPress=setTimeout(()=>{longPress=null;entry.dataset.longpress='1';if(confirm('このファイルを削除しますか？'))deleteFile(f.id).then(refreshFiles)},700)});for(const ev of ['pointerup','pointercancel','pointermove'])entry.addEventListener(ev,()=>{clearTimeout(longPress)});entry.addEventListener('click',e=>{if(entry.dataset.longpress){e.stopImmediatePropagation();delete entry.dataset.longpress}},true);grid.append(entry)}if(kind==='music'&&filtered.length){const p=document.createElement('p');p.className='hint';p.textContent='曲をタップするとプレイヤーが開きます。長押しまたは右クリックで削除できます。';body.append(p)}}return{body,cleanup}}function openFile(f){const url=URL.createObjectURL(f.blob);let b,cleanup=()=>URL.revokeObjectURL(url);if(f.type.startsWith('image/')){b=node('<div style="height:100%;display:flex;flex-direction:column;gap:8px"><div class="hint"></div><div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto;touch-action:pan-y"><img class="viewer" alt="画像"></div></div>');b.querySelector('.hint').textContent=f.name;b.querySelector('img').src=url}else{b=node('<div class="player"><div class="track"></div><audio controls style="width:100%"></audio><div class="hint">端末の音量設定も確認してください。</div></div>');b.querySelector('.track').textContent='▶ '+f.name;b.querySelector('audio').src=url;b.querySelector('audio').play().catch(()=>{});cleanup=()=>{b.querySelector('audio').pause();URL.revokeObjectURL(url)}}makeWin('file',f.name,f.type.startsWith('image/')?'🖼️':'🎵',b,560,390,cleanup)}async function launch(kind){menu.classList.remove('open');let title=appList.find(a=>a[0]===kind)?.[2]||kind,icon=appList.find(a=>a[0]===kind)?.[1]||'▣';try{const {body,cleanup}=await renderApp(kind);makeWin(kind,title,icon,body,kind==='notes'?480:600,kind==='notes'?430:410,cleanup)}catch(e){alert('アプリを開けませんでした: '+e.message)}}for(const [kind,icon,title]of appList){let d=document.createElement('div');d.className='desk-icon';d.innerHTML=`<span class="ico">${icon}</span><span>${title}</span>`;d.onclick=()=>launch(kind);icons.append(d);let m=document.createElement('div');m.className='menu-item';m.textContent=icon+' '+title;m.onclick=()=>launch(kind);$('#menuItems').append(m)}const startBtn=$('#startBtn');let lastStartTouch=0;function toggleStart(e){e.preventDefault();e.stopPropagation();menu.classList.toggle('open');startBtn.classList.toggle('active',menu.classList.contains('open'));sound(620)}startBtn.addEventListener('click',e=>{if(Date.now()-lastStartTouch<650){e.preventDefault();return}toggleStart(e)});startBtn.addEventListener('touchend',e=>{lastStartTouch=Date.now();toggleStart(e)},{passive:false});desktop.addEventListener('pointerdown',e=>{if(!e.target.closest('.start-menu,#startBtn')){menu.classList.remove('open');startBtn.classList.remove('active')}});function clock(){const d=new Date();$('#clock').textContent=d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}clock();setInterval(clock,10000);function showScreen(){$('#screen').classList.add('on')}function hideScreen(){$('#screen').classList.remove('on');lastAction=Date.now()}$('#screen').addEventListener('pointerdown',hideScreen);for(const ev of ['pointerdown','keydown','wheel'])document.addEventListener(ev,()=>{lastAction=Date.now()},{passive:true});setInterval(()=>{if(Date.now()-lastAction>120000)showScreen()},5000);openDB().catch(()=>alert('この環境ではファイル保存が利用できません。HTTPSまたはlocalhostで開いてください。'));let first=true;document.addEventListener('pointerdown',()=>{if(first){first=false;startup()}},{once:true});})();
